[project]
name = "agno-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "agno>=1.5",
    "python-multipart>=0.0.22",
    "aiofiles>=25.1.0",
    "requests>=2.33.0",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.11.4",
    "ollama>=0.6.1",
    "httpx[socks]>=0.28.1",
    "openai>=2.30.0",
    "loguru>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-env>=1.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["scripts"]
env = [
    "DATABASE_URL=sqlite:///./test.db",
]

